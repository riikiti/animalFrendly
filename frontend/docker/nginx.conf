server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Чистый SPA-fallback — без проксирования /api и /app. В docker-compose.prod.yml (Вариант B
    # из docs/deploy/03-vps-guide.md) весь роутинг берёт на себя Caddy перед всеми контейнерами,
    # см. deploy/Caddyfile.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
